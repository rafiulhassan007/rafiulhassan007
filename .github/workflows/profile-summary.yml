name: Profile summary cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release/v2
        env:
          # Use a personal access token (classic) with "repo" and "user" scopes
          # saved as a repository secret named PROFILE_TOKEN, so private
          # contributions are counted. GITHUB_TOKEN alone only sees public data.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 6
